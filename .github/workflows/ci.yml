name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reggie:
    name: reggie (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/reggie
    steps:
      - uses: actions/checkout@v4
        with:
          # History is the product: history.ts reads `git log --numstat` over 365 days,
          # and task state is derived from branches. A shallow clone makes both lie.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/reggie/package-lock.json
      # npm 10.9 crashes resolving vitest 4 peers without this; see CLAUDE.md gotchas.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The bin is not installed in this job, so the check runs from the output `npm run build`
      # just wrote. It stays last: the CLI refuses every command when `dist/` is behind `src/`.
      - name: docs check (CLAUDE.md and AGENTS.md)
        run: node dist/cli.js docs check
