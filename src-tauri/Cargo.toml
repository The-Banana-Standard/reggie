[package]
name = "reggie"
version = "2.0.1"
description = "Brain-dump to merged PR — a desktop workspace and agent system that turns messy notes into shipped code with Claude Code."
authors = ["Jacob Press", "Anthony Mazzola"]
license = "MIT"
edition = "2021"

[lib]
name = "reggie_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
