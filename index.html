<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/reggie-logo.png" />
    <title>Reggie</title>
  </head>
  <body>
    <script>
      // Apply persisted theme synchronously to prevent flash of wrong theme
      try {
        var t = localStorage.getItem("reggie-theme");
        document.documentElement.dataset.theme = (t === "light" || t === "dark") ? t : "light";
      } catch(e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
