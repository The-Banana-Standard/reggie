# Reggie configuration.
# mode: solo (approvals implicit, no PR required for plans) or team (deciders by risk, PR by default).
# risk: path or keyword patterns that raise a task's risk class when its files match.
mode: solo
# defaultBranch: the branch tasks branch from and plans merge to. Set to repo-manager while v3 is built
# on this branch in a worktree; drop it once the branch lands on main.
defaultBranch: repo-manager
# install: the directories that hold installed dependencies, and the command that installs them
# there. A claimed worktree links each directory's node_modules from the serving checkout when the
# lockfiles are byte-identical, and otherwise runs the command in the worktree. The peer-dependency
# flag is this repo's own workaround, tracked as npm-ci-without-legacy-peer-deps.
install:
  - dir: packages/reggie
    command: npm ci --legacy-peer-deps
mcpServerName: reggie
risk:
  high:
    - auth
    - login
    - session
    - password
    - payment
    - billing
    - schema
    - migration
    - secret
    - token
    - security
    - rules
  medium:
    - shared
    - common
    - core
    - lib
    - util
    - api
    - model
    - store
# policy: the highest risk class that passes without a person, one class per kind of packet.
#   plans: for a plan. With high, every plan that passes the plan contract counts as planned, which
#     is what solo mode has always done; narrowing it is not enforced yet.
#   completions: for a finished task. With low, only a task whose effective risk class is low could
#     pass; the class is the highest of the plan's risk line, its file list, and the files the branch
#     really changed.
#   Values: none, low, medium, high. none means nothing passes without a person.
# Reggie reads this block from the integration branch's committed copy, never from a task branch,
# so a task cannot widen the policy it is judged by. In this version the verdict is reported
# (`reggie check <slug>`, and on the task page) and nothing acts on it: a person still decides every
# task with `reggie decide`. Acting on the verdict is the item `policy-acts-on-its-verdict`.
policy:
  plans: high
  completions: low
