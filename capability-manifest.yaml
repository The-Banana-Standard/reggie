# Capability Manifest — Pre-computed index of tools, plugins, and skills
# available to Reggie pipelines. Used by RESEARCH/PLAN stages for
# capability-aware planning. Updated via /refresh-capabilities.
#
# Sources:
#   official-plugin  — Claude official plugin marketplace (internal + external)
#   community-plugin — Third-party plugin marketplaces (e.g., wshobson/agents)
#   community-skill  — Community Claude Code skills (SKILL.md-based playbooks)
#   smithery         — Smithery.ai verified servers (top by category)
#   local-mcp        — mcp-registry.yaml (curated MCP servers, cross-referenced)
#
# The local-mcp entries are NOT duplicated here — they live in mcp-registry.yaml.
# Community skill entries are populated from skills-registry.yaml via /refresh-capabilities.
# Pipeline stages should read both files. This manifest adds awareness of
# capabilities BEYOND what mcp-registry.yaml covers.

metadata:
  last_refreshed: "2026-03-03T22:00:00Z"
  sources:
    official_plugins: 42
    community_plugins: 34
    smithery_servers: 30
    community_skills: 15  # From skills-registry.yaml
    local_mcp: 13        # Cross-reference to mcp-registry.yaml

